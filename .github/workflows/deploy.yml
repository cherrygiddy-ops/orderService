name: Deploy OrderService

on:
  push:
    branches: [ "main" ]   # adjust if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/cherrygiddy-ops/hotelpos_orderservice:latest .

      - name: Push Docker image
        run: docker push ghcr.io/cherrygiddy-ops/hotelpos_orderservice:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

            # Move into deployment repo where docker-compose.yml lives
            cd /app/hotelpos-deployment
            git pull origin main

            # Write Mongo + JWT secrets into .env
            echo "MONGO_HOST=${{ secrets.MONGO_HOST }}" > .env
            echo "MONGO_USER=${{ secrets.MONGO_USER }}" >> .env
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env
            echo "MONGO_DB=${{ secrets.MONGO_DB }}" >> .env
            echo "MONGO_URI=mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@${{ secrets.MONGO_HOST }}:27017/${{ secrets.MONGO_DB }}" >> .env

            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}" >> .env
            echo "JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}" >> .env

            # Redeploy only the orderservice container with env-file
            docker compose --env-file .env pull orderservice
            docker compose --env-file .env up -d orderservice

            # Show container status
            docker compose ps
